<!doctype html><html><head><meta charset="utf-8"><title>Vista de modelos</title>
<style>body{margin:0;background:#05070c}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();const c=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,0.1,500);c.position.set(0,70,75);c.lookAt(0,0,2);
s.add(new THREE.HemisphereLight(0xbfd4ff,0x302010,1.2));const d=new THREE.DirectionalLight(0xffe0b0,2.5);d.position.set(5,10,4);s.add(d);
const names=['bob','challenger','dispatcher','executioner','imperial','insurgent','omen','pancake','spitfire','striker','zenith'];
const L=new GLTFLoader();
names.forEach((n,i)=>L.load('../assets/modelos/'+n+'.glb',g=>{const m=g.scene;m.position.set((i%4-1.5)*14,0,Math.floor(i/4)*16-14);m.rotation.y=-0.6;s.add(m);
 const cv=document.createElement('canvas');cv.width=256;cv.height=48;const x=cv.getContext('2d');x.fillStyle='#fff';x.font='bold 30px sans-serif';x.fillText(n,4,34);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv)}));sp.scale.set(8,1.5,1);sp.position.set(m.position.x,4,m.position.z+6);s.add(sp);}));
(function f(){requestAnimationFrame(f);r.render(s,c)})();
</script></body></html>
