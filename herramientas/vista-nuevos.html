<!doctype html><html><head><meta charset="utf-8"><title>Modelos nuevos</title>
<style>body{margin:0;background:#1a1f2a;color:#fff;font:14px sans-serif}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
</head><body><script type="module">
// Herramienta: muestra cada modelo nuevo normalizado a 10 m, con ejes (rojo X, verde Y, azul Z)
// y su caja, para decidir hacia dónde apunta la proa. ?vista=arriba|lado|frente|tres
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
const s=new THREE.Scene();s.background=new THREE.Color(0x1a1f2a);
const vista=new URLSearchParams(location.search).get('vista')||'tres';
const c=new THREE.OrthographicCamera(-40,40,40*innerHeight/innerWidth,-40*innerHeight/innerWidth,-500,500);
({arriba:[0,100,0.001],lado:[100,0,0],frente:[0,0,100],tres:[60,50,70]})[vista].forEach((v,i)=>c.position.setComponent(i,v));c.lookAt(0,0,0);
s.add(new THREE.HemisphereLight(0xffffff,0x404050,2));const d=new THREE.DirectionalLight(0xffffff,2);d.position.set(5,10,4);s.add(d);
const solo=new URLSearchParams(location.search).get('solo');
const names=solo?[solo]:['rlab-skycruiser','rylek-brig','rlab-fragata','rlab-ranger','rylek-skiff','rylek-galley','rylek-galleon'];
const L=new GLTFLoader();
names.forEach((n,i)=>L.load('../assets/modelos/'+n+'.glb',g=>{const m=g.scene;const bb=new THREE.Box3().setFromObject(m);const sz=bb.getSize(new THREE.Vector3());const k=14/Math.max(sz.x,sz.y,sz.z);
 const ctr=bb.getCenter(new THREE.Vector3());const piv=new THREE.Group();m.position.sub(ctr);piv.add(m);piv.scale.setScalar(k);
 if(solo)piv.scale.multiplyScalar(4);const px=solo?0:(i%4-1.5)*20, pz=solo?0:Math.floor(i/4)*24-12;const grp=new THREE.Group();grp.position.set(px,0,pz);grp.add(piv);grp.add(new THREE.AxesHelper(9));s.add(grp);
 console.log(n,'tam',sz.toArray().map(v=>v.toFixed(2)).join(' '));
 const cv=document.createElement('canvas');cv.width=256;cv.height=48;const x=cv.getContext('2d');x.fillStyle='#ff0';x.font='bold 26px sans-serif';x.fillText(n,4,34);
 const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),depthTest:false}));sp.scale.set(12,2.2,1);sp.position.set(px,9,pz+9);s.add(sp);r.render(s,c);}));
(function f(){requestAnimationFrame(f);r.render(s,c)})();
</script></body></html>
